name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run test
      - run: bun run build:frontends
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo fmt --manifest-path mobile/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
        env:
          AWS_LC_SYS_NO_ASM: "1"
