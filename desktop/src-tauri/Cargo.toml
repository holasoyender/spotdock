[package]
name = "spotdock-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/holasoyender/spotdock"

[lib]
name = "spotdock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "native-tls", "charset", "http2", "system-proxy"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Media", "Storage_Streams", "Foundation", "Foundation_Collections", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
